name: Build_APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: FarisHuyam/buildozer-action@v2
        with:
          buildozer_version: stable
          python_version: 3.9
      - name: Upload APK
        run: |
          cp bin/*.apk ./app-release.apk || true
          git config --global user.name 'github-actions'
          git config --global user.email 'action@github.com'
          git add app-release.apk
          git commit -m "Generated APK" || true
          git push || true
