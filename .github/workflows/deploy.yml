name: Diamond_V5_Ultimate_Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # نصب تمام پیش‌نیازهای گرافیکی و سیستمی
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential \
          libgdbm-dev libnss3-dev libsqlite3-dev libreadline-dev tk-dev uuid-dev lzma-dev \
          libjpeg-dev zlib1g-dev
          pip install --user --upgrade buildozer cython virtualenv pillow

      # دستور جادویی ساخت با تایید خودکار لایسنس
      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer -v android debug
        continue-on-error: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-Ultra-V5-Pro
          path: bin/*.apk
