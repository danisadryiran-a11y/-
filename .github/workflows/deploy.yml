name: Diamond_Cloud_Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build with Buildozer
        uses: FarisHuyam/buildozer-action@v2
        with:
          buildozer_version: stable
          python_version: 3.9

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-Ultra-APK
          path: bin/*.apk
