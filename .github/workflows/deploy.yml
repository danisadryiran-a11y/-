name: Diamond_Cloud_Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: FarisHuyam/buildozer-action@v2
        with:
          buildozer_version: stable
          python_version: 3.9

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-APK
          path: bin/*.apk
