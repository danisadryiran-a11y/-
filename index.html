<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Phoenix v20</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <style>
        :root { --bg: #08080a; --accent: #00f2ff; --irancell: #ffcc00; --mci: #00a0a5; --shatel: #ed1c24; }
        body { background: var(--bg); color: #fff; font-family: 'Vazirmatn', sans-serif; margin: 0; padding-bottom: 50px; }
        .header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--accent); }
        .isp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px; background: #111; }
        .isp-btn { padding: 12px 5px; border-radius: 8px; background: #1a1a1e; font-size: 10px; cursor: pointer; text-align: center; border: 1px solid #333; transition: 0.2s; color: #888; }
        .isp-btn.active[data-isp="irancell"] { border-color: var(--irancell); color: var(--irancell); }
        .isp-btn.active[data-isp="mci"] { border-color: var(--mci); color: var(--mci); }
        .isp-btn.active[data-isp="shatel"] { border-color: var(--shatel); color: var(--shatel); }
        .qr-box { background: #fff; padding: 15px; border-radius: 20px; display: inline-block; margin: 20px auto; border: 6px solid var(--accent); }
        .panel { padding: 15px; }
        .status { background: #16161a; padding: 12px; border-radius: 12px; font-size: 11px; border-right: 4px solid var(--accent); margin-bottom: 15px; }
        .btn-run { background: #fff; color: #000; width: 100%; border: none; padding: 20px; border-radius: 18px; font-weight: bold; font-family: 'Vazirmatn'; font-size: 16px; cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-tool { background: #1a1a1e; color: #fff; padding: 14px; border-radius: 12px; border: 1px solid #333; cursor: pointer; font-family: 'Vazirmatn'; font-size: 11px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size:20px;">PHOENIX <span style="color:var(--accent)">v20 UNIFIED</span></h2>
</div>

<div class="isp-grid">
    <div class="isp-btn active" data-isp="irancell" onclick="setISP('irancell')">ایرانسل</div>
    <div class="isp-btn" data-isp="mci" onclick="setISP('mci')">همراه اول</div>
    <div class="isp-btn" data-isp="shatel" onclick="setISP('shatel')">شاتل / ثابت</div>
</div>

<div class="panel">
    <div class="status">
        <i class="fas fa-shield-alt"></i> مسیر درگاه: <b id="host-name" style="color:var(--accent)">snapp.ir</b>
    </div>

    <div style="text-align:center;">
        <div class="qr-box" id="qr-container"><div id="qrcode"></div></div>
        <div id="node-info" style="font-size:10px; color:#555; margin-bottom:15px;">آماده دریافت سرور جدید</div>
    </div>

    <button class="btn-run" onclick="fetchNodes()">
        <i class="fas fa-sync-alt"></i> فعال‌سازی هوشمند (نسخه بیست)
    </button>

    <div class="tools">
        <button class="btn-tool" onclick="copyV2()"><i class="fas fa-copy"></i> کپی لینک</button>
        <button class="btn-tool" onclick="share()"><i class="fab fa-telegram"></i> تلگرام</button>
        <button class="btn-tool" onclick="dl('npv')">فایل NPV</button>
        <button class="btn-tool" onclick="dl('hat')">فایل HAT</button>
    </div>
</div>

<script>
    let currentISP = 'irancell';
    let store = { irancell: [], mci: [], shatel: [] };
    let qrcode = new QRCode(document.getElementById("qrcode"), { width: 170, height: 170 });
    
    const settings = {
        irancell: { host: "snapp.ir", color: "#ffcc00" },
        mci: { host: "sep.shaparak.ir", color: "#00a0a5" },
        shatel: { host: "app.shatelmobile.ir", color: "#ed1c24" }
    };

    function setISP(isp) {
        currentISP = isp;
        document.querySelectorAll('.isp-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-isp="${isp}"]`).classList.add('active');
        document.getElementById('host-name').innerText = settings[isp].host;
        document.getElementById('qr-container').style.borderColor = settings[isp].color;
        if(store[isp].length > 0) render();
    }

    async function fetchNodes() {
        const btn = document.querySelector('.btn-run');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال عبور از سد فایروال...';
        
        // استفاده از پروکسی معکوس برای حل مشکل CORS
        const proxy = "https://api.allorigins.win/get?url=";
        const target = encodeURIComponent("https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/protocols/reality");

        try {
            const response = await fetch(proxy + target);
            const json = await response.json();
            const rawNodes = json.contents.match(/(vless|reality):\/\/[^\s|\x22]+/gi) || [];
            
            store.irancell = rawNodes.filter((_, i) => i % 3 === 0).slice(0, 10);
            store.mci = rawNodes.filter((_, i) => i % 3 === 1).slice(0, 10);
            store.shatel = rawNodes.filter((_, i) => i % 3 === 2).slice(0, 10);

            render();
            btn.innerHTML = '<i class="fas fa-check"></i> بروزرسانی با موفقیت انجام شد';
            btn.style.background = "#32d74b";
        } catch (err) {
            btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> تلاش مجدد با پل دوم...';
            // اینجا می‌توان پل‌های پشتیبان دیگر را فراخوانی کرد
        }
    }

    function render() {
        const node = store[currentISP][0];
        qrcode.clear();
        qrcode.makeCode(node);
        document.getElementById('node-info').innerText = "سرور فعال: " + settings[currentISP].host;
    }

    function copyV2() {
        navigator.clipboard.writeText(store[currentISP][0]);
        alert("سرور کپی شد!");
    }

    function dl(ext) {
        const h = settings[currentISP].host;
        const pay = btoa(`GET / HTTP/1.1\r\nHost: ${h}\r\nConnection: Keep-Alive\r\n\r\n`);
        const conf = btoa(JSON.stringify({ sni: h, payload: pay, node: store[currentISP][0] }));
        const a = document.createElement('a');
        a.href = 'data:text/plain;base64,' + conf;
        a.download = `Quantum_v20_${currentISP}.${ext}`;
        a.click();
    }

    function share() {
        const msg = encodeURIComponent("🚀 سرور جدید Quantum v20 مخصوص " + currentISP + "\n\n" + store[currentISP][0]);
        window.open(`https://t.me/share/url?url=${msg}`);
    }
</script>
</body>
</html>
