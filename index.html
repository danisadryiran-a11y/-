<script>
    const KEY = "Gsk_FgeJNCyMv9vLzLVKBu3aWGdyb3FYlZ9Ybm5HBZjqSGupFZ4UN63z";
    // ... بقیه کدها مشابه قبل ...

    async function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        render('user', text);
        history.push({ role: "user", content: text });
        userInput.value = '';
        sendBtn.disabled = true;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: history,
                    temperature: 1.0
                })
            });

            const data = await response.json();
            
            // بررسی لایه امنیتی Groq یا خطای API
            if (data.error) {
                render('assistant', "خطای سرویس: " + data.error.message);
                return;
            }

            const aiText = data.choices[0].message.content;
            render('assistant', aiText);
            history.push({ role: "assistant", content: aiText });
            localStorage.setItem('chat_logs', JSON.stringify(history));

        } catch (err) {
            // نمایش خطای دقیق در کنسول مرورگر
            console.error("Fetch Error:", err);
            render('assistant', "خطا در اتصال! احتمالاً باید VPN خود را روشن کنید یا از 'شکن' استفاده کنید.");
        } finally {
            sendBtn.disabled = false;
        }
    }
    // ... بقیه کدها ...
</script>
