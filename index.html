<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra AI | Domain Active</title>
    <style>
        :root {
            --neon: #00f2ff;
            --bg: #080808;
            --panel: #121212;
            --text: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
            flex-wrap: wrap;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--neon);
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 700;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 90%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 15px;
            word-wrap: break-word;
            position: relative;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #004d40, #002d26);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;
            background: #1a1a1a;
            border-left: 3px solid var(--neon);
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }

        .input-box {
            background: var(--panel);
            padding: 16px;
            display: flex;
            gap: 12px;
            border-top: 1px solid #222;
        }

        textarea {
            flex: 1;
            background: #000;
            color: white;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 14px;
            height: 56px;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        textarea:focus { border-color: var(--neon); }

        button {
            background: var(--neon);
            color: black;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            min-width: 90px;
        }

        button:hover { transform: scale(1.03); filter: brightness(1.1); }
        button:disabled { background: #444; cursor: wait; }

        .danger {
            background: transparent;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 10px;
        }

        .ltr { direction: ltr; text-align: left; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media (max-width: 600px) {
            .message { max-width: 100%; }
            button { min-width: 80px; }
        }
    </style>
</head>
<body>

<header>
    <div class="status-badge">
        <div style="width:10px; height:10px; background:var(--neon); border-radius:50%; box-shadow:0 0 10px var(--neon);"></div>
        Llama-3.3-70B Active
    </div>
    <button class="danger" id="resetBtn">Reset Session</button>
</header>

<div id="chat-window" aria-live="polite"></div>

<div class="input-box">
    <textarea id="userInput" placeholder="پیام خود را بنویسید... (Enter برای ارسال)"></textarea>
    <button id="sendBtn">ارسال</button>
</div>

<script>
    // توجه: کلید API را هرگز داخل HTML عمومی نگذارید.
    // در حالت واقعی، درخواست‌ها باید از طریق سرور شما پروکسی شوند.
    const KEY = "YOUR_API_KEY_HERE";

    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    const STORAGE_KEY = 'chat_logs_v1';
    let history = loadHistory();

    function loadHistory() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    function saveHistory() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        } catch {
            // ممکن است در محیط sandbox ذخیره‌سازی کار نکند
        }
    }

    window.onload = () => {
        history.forEach(m => render(m.role, m.content));
        chatWindow.scrollTop = chatWindow.scrollHeight;
    };

    function render(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role === 'user' ? 'user' : 'ai'}`;
        if (!/[\u0600-\u06FF]/.test(text)) div.classList.add('ltr');
        div.textContent = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        render('user', text);
        history.push({ role: "user", content: text });
        saveHistory();

        userInput.value = '';
        sendBtn.disabled = true;

        try {
            if (!KEY || KEY === "YOUR_API_KEY_HERE") {
                throw new Error("API key is missing.");
            }

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: history,
                    temperature: 0.8,
                    max_tokens: 1024
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }

            const data = await response.json();
            const aiText = data?.choices?.[0]?.message?.content?.trim();

            if (!aiText) throw new Error("Empty response.");

            render('assistant', aiText);
            history.push({ role: "assistant", content: aiText });
            saveHistory();

        } catch (err) {
            render('assistant', "خطا: ارتباط یا تنظیمات API مشکل دارد.");
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', handleChat);

    resetBtn.addEventListener('click', () => {
        history = [];
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        chatWindow.innerHTML = '';
    });

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleChat();
        }
    });
</script>

</body>
</html>
