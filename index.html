<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EMPEROR V7 | QUANTUM CORE</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg: #050505;
            --card-bg: #0f0f0f;
            --mci: #00f2ff;
            --mtn: #ffcc00;
            --rtl: #d500f9;
            --btn-npv: #673ab7;
            --btn-ha: #bf360c;
            --text-main: #ffffff;
            --text-dim: #777777;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 25px 20px;
            text-align: center;
            background: linear-gradient(180deg, #111 0%, transparent 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: var(--mci); text-shadow: 0 0 15px var(--mci); }

        .control-panel { padding: 20px; text-align: center; }

        .btn-update {
            width: 100%; max-width: 400px;
            padding: 18px; border-radius: 15px;
            border: 1px solid #333;
            background: #fff; color: #000;
            font-size: 1.1rem; font-weight: 800;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .btn-update:active { transform: scale(0.96); }

        /* استایل سکشن اپراتورها مطابق عکس */
        .op-section {
            margin: 10px 15px 25px 15px;
            background: #0a0a0a;
            border-radius: 18px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }

        .op-section.mci { border-top: 3px solid var(--mci); }
        .op-section.mtn { border-top: 3px solid var(--mtn); }

        .op-title {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-weight: bold; font-size: 1rem;
        }

        .badge { background: #1a1a1a; padding: 2px 10px; border-radius: 5px; font-size: 0.8rem; color: #aaa; }

        /* کارت کانفیگ مطابق اسکرین‌شات */
        .config-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .card-meta {
            display: flex; justify-content: space-between;
            font-size: 0.75rem; color: var(--text-dim);
            margin-bottom: 12px;
        }

        .host-tag { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; border: 1px solid #333; }

        /* دکمه‌های عملیات ۳ تایی */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 0.6fr;
            gap: 10px;
        }

        .btn-act {
            padding: 10px; border-radius: 8px; border: none;
            font-size: 0.85rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            cursor: pointer; transition: 0.2s;
        }

        .btn-ha { background: rgba(191, 54, 12, 0.2); color: #ff8a65; border: 1px solid rgba(191, 54, 12, 0.3); }
        .btn-npv { background: rgba(103, 58, 183, 0.2); color: #d1c4e9; border: 1px solid rgba(103, 58, 183, 0.3); }
        .btn-copy { background: rgba(255, 255, 255, 0.08); color: #fff; }

        .btn-act:active { filter: brightness(1.5); transform: translateY(2px); }

        /* نوتیفیکیشن */
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; padding: 12px 30px;
            border-radius: 50px; font-weight: bold; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #toast.show { bottom: 40px; }

    </style>
</head>
<body>

<header>
    <div class="logo">EMPEROR <span>V7</span></div>
    <div id="status" style="font-size: 0.7rem; color: #555; margin-top: 8px;">آماده تزریق کوانتومی</div>
</header>

<div class="control-panel">
    <button class="btn-update" id="mainBtn" onclick="runCore()">
        <i class="fa-solid fa-bolt-lightning"></i> آپدیت و اسکن منابع
    </button>
</div>

<main id="container" style="display:none">
    <div class="op-section mci">
        <div class="op-title">
            <span style="color:var(--mci)">MCI | همراه اول</span>
            <span class="badge" id="count-mci">0</span>
        </div>
        <div id="list-mci"></div>
    </div>

    <div class="op-section mtn">
        <div class="op-title">
            <span style="color:var(--mtn)">MTN | ایرانسل</span>
            <span class="badge" id="count-mtn">0</span>
        </div>
        <div id="list-mtn"></div>
    </div>
</main>

<div id="toast">پیام سیستم</div>

<script>
    const BUGS = { mci: "mci.ir", mtn: "lens.ir" };
    const SOURCES = [
        "https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/xray/normal/mix",
        "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity"
    ];

    async function runCore() {
        const btn = document.getElementById('mainBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> در حال استخراج...';

        try {
            const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(SOURCES[0]));
            const text = await response.text();
            const configs = text.match(/(vless|vmess|trojan|ss):\/\/[^\s]+/g).slice(0, 20);

            render(configs, 'mci');
            render(configs, 'mtn');

            document.getElementById('container').style.display = 'block';
            document.getElementById('status').innerText = "تمامی کانفیگ‌ها با موفقیت تزریق شدند";
            showToast("دیتابیس به‌روزرسانی شد");
        } catch (e) {
            showToast("خطا در اتصال به سرور");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-rotate"></i> آپدیت مجدد لیست';
        }
    }

    function render(configs, op) {
        const list = document.getElementById(`list-${op}`);
        list.innerHTML = '';
        document.getElementById(`count-${op}`).innerText = configs.length;

        configs.forEach((conf, i) => {
            const injected = inject(conf, BUGS[op], op);
            const card = document.createElement('div');
            card.className = 'config-card';
            card.innerHTML = `
                <div class="card-meta">
                    <span class="host-tag">${BUGS[op]}</span>
                    <span>Config #${i+1}</span>
                </div>
                <div class="action-grid">
                    <button class="btn-act btn-ha" onclick="copyHA('${conf}', '${BUGS[op]}')">HA <i class="fa-solid fa-bolt"></i></button>
                    <button class="btn-act btn-npv" onclick="copyNPV('${injected}', '${op}')">NPV <i class="fa-solid fa-file-import"></i></button>
                    <button class="btn-act btn-copy" onclick="copyRaw('${injected}')"><i class="fa-regular fa-copy"></i></button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function inject(link, bug, op) {
        try {
            if (link.startsWith('vless://') || link.startsWith('trojan://')) {
                const u = new URL(link);
                u.searchParams.set('sni', bug);
                u.searchParams.set('host', bug);
                u.hash = `Emperor_${op.toUpperCase()}`;
                return u.toString();
            }
            return link;
        } catch (e) { return link; }
    }

    function copyNPV(link, op) {
        navigator.clipboard.writeText(link).then(() => {
            showToast(`کانفیگ ${op.toUpperCase()} کپی شد`);
            // یادآوری مهم برای رفع ارور فایل ساین
            setTimeout(() => {
                alert("توجه: در برنامه NPV Tunnel دکمه + و سپس گزینه Import from Clipboard را بزنید.");
            }, 500);
        });
    }

    function copyHA(link, bug) {
        const payload = `GET / HTTP/1.1[crlf]Host: ${bug}[crlf]Connection: Keep-Alive[crlf][crlf]`;
        navigator.clipboard.writeText(`Payload: ${payload}\n\nConfig: ${link}`).then(() => {
            showToast("پیلود و کانفیگ کپی شد");
        });
    }

    function copyRaw(link) {
        navigator.clipboard.writeText(link).then(() => showToast("لینک کپی شد"));
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
</script>

</body>
</html>
