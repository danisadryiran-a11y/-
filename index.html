<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>EMPEROR V5: QUANTUM INJECTOR</title>
    
    <!-- فونت و آیکون -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            
            /* رنگ‌های امپراطور */
            --mci: #00f2ff;   /* Cyan Neon */
            --mtn: #ffd600;   /* Gold Neon */
            --rtl: #d500f9;   /* Purple Neon */
            --sht: #ff3d00;   /* Orange Neon */
            
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* هدر نئونی */
        header {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff9d;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff9d;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* پنل کنترل */
        .control-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-scan {
            background: linear-gradient(135deg, #111, #000);
            border: 1px solid var(--border);
            color: #fff;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .btn-scan::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        
        .btn-scan:hover::before { left: 100%; }
        .btn-scan:active { transform: scale(0.96); border-color: #fff; }
        .btn-scan:disabled { opacity: 0.6; cursor: not-allowed; }

        /* گرید اپراتورها */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 0 20px;
        }

        .op-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.3s;
        }

        /* رنگ‌بندی اختصاصی */
        .op-mci { border-top: 3px solid var(--mci); }
        .op-mtn { border-top: 3px solid var(--mtn); }
        .op-rtl { border-top: 3px solid var(--rtl); }
        .op-sht { border-top: 3px solid var(--sht); }

        .op-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-weight: bold;
        }

        .config-item {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.2s;
        }

        .config-item:hover {
            background: rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.1);
        }

        .config-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .protocol-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .protocol-vmess { background: rgba(0, 150, 255, 0.2); color: #64b5f6; }
        .protocol-vless { background: rgba(76, 175, 80, 0.2); color: #81c784; }
        .protocol-trojan { background: rgba(244, 67, 54, 0.2); color: #e57373; }
        .protocol-ss { background: rgba(156, 39, 176, 0.2); color: #ba68c8; }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-mini {
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }

        .btn-copy { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-npv { background: rgba(100, 50, 255, 0.2); color: #b388ff; border: 1px solid rgba(100, 50, 255, 0.3); }
        .btn-ha { background: rgba(255, 100, 50, 0.2); color: #ffab91; border: 1px solid rgba(255, 100, 50, 0.3); }

        .btn-mini:active { transform: scale(0.95); filter: brightness(1.2); }

        /* نوتیفیکیشن سفارشی (Toast) */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #111;
            border: 1px solid var(--border);
            padding: 12px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { border-color: #ff3d00; }
        .toast.success { border-color: #00ff9d; }
        .toast i.success { color: #00ff9d; }
        .toast i.error { color: #ff3d00; }

        /* لاگ کنسول */
        .console {
            margin: 0 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 20px;
            background: var(--glass);
            border-radius: 12px;
            margin: 0 20px 20px;
            border: 1px solid var(--border);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00f2ff, #d500f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <header>
        <h1><span class="status-dot"></span> EMPEROR V5</h1>
    </header>

    <div class="control-panel">
        <button class="btn-scan" id="startBtn" onclick="runEmperorSystem()">
            <i class="fa-solid fa-satellite-dish"></i> شروع اسکن کوانتومی
        </button>
        <div class="console" id="logArea">سیستم آماده است. دکمه اسکن را بزنید.</div>
    </div>

    <div class="stats-bar" id="statsBar" style="display: none;">
        <div class="stat-item">
            <div class="stat-value" id="totalConfigs">0</div>
            <div class="stat-label">کانفیگ کل</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="validConfigs">0</div>
            <div class="stat-label">قابل استفاده</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="sourceCount">0</div>
            <div class="stat-label">منبع</div>
        </div>
    </div>

    <div class="grid-container" id="gridSystem" style="opacity: 0.3; pointer-events: none; transition: 0.5s;">
        
        <!-- همراه اول -->
        <div class="op-card op-mci">
            <div class="op-header">
                <span style="color:var(--mci)"><i class="fa-solid fa-mobile"></i> MCI</span>
                <span class="badge" id="badge-mci">0</span>
            </div>
            <div id="list-mci"></div>
        </div>

        <!-- ایرانسل -->
        <div class="op-card op-mtn">
            <div class="op-header">
                <span style="color:var(--mtn)"><i class="fa-solid fa-tower-cell"></i> MTN</span>
                <span class="badge" id="badge-mtn">0</span>
            </div>
            <div id="list-mtn"></div>
        </div>

        <!-- رایتل -->
        <div class="op-card op-rtl">
            <div class="op-header">
                <span style="color:var(--rtl)"><i class="fa-solid fa-sim-card"></i> Rightel</span>
                <span class="badge" id="badge-rtl">0</span>
            </div>
            <div id="list-rtl"></div>
        </div>

        <!-- شاتل -->
        <div class="op-card op-sht">
            <div class="op-header">
                <span style="color:var(--sht)"><i class="fa-solid fa-wifi"></i> Shatel</span>
                <span class="badge" id="badge-sht">0</span>
            </div>
            <div id="list-sht"></div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-check-circle success"></i>
        <span id="toastMsg">عملیات موفقیت آمیز بود</span>
    </div>

    <script>
        // === تنظیمات امپراطور ===
        
        // دامنه‌های باگ (Bug Hosts) - قابل تغییر
        const BUGS = {
            mci: "mci.ir",           
            mtn: "lens.ir",          
            rtl: "rightel.ir",       
            sht: "my.shatel.ir"      
        };

        // منابع (Sources)
        const REPOS = [
            'https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/xray/normal/mix',
            'https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity',
            'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt',
            'https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt'
        ];

        // سیستم چرخش پروکسی برای عبور از اختلالات
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://api.codetabs.com/v1/proxy?quest='
        ];

        let collectedConfigs = [];
        let parsedConfigs = [];

        function log(msg) { 
            const logArea = document.getElementById('logArea');
            logArea.innerText = msg;
            console.log(msg);
        }
        
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const icon = t.querySelector('i');
            document.getElementById('toastMsg').innerText = msg;
            
            icon.className = type === 'success' ? 'fa-solid fa-check-circle success' : 'fa-solid fa-exclamation-circle error';
            t.className = 'toast ' + type;
            
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // === پارسرهای پیشرفته ===
        
        function parseVmess(link) {
            try {
                const json = JSON.parse(atob(link.replace('vmess://', '')));
                return {
                    protocol: 'vmess',
                    address: json.add,
                    port: parseInt(json.port) || 443,
                    id: json.id,
                    network: json.net || 'ws',
                    host: json.host || json.add,
                    path: json.path || '/',
                    tls: json.tls || 'tls',
                    sni: json.sni || json.host || json.add,
                    remarks: json.ps || 'VMess Config',
                    raw: link
                };
            } catch(e) { 
                console.error('VMess parse error:', e);
                return null; 
            }
        }

        function parseVless(link) {
            try {
                const url = new URL(link);
                return {
                    protocol: 'vless',
                    address: url.hostname,
                    port: parseInt(url.port) || 443,
                    id: url.username,
                    network: url.searchParams.get('type') || 'ws',
                    host: url.searchParams.get('host') || url.hostname,
                    path: url.searchParams.get('path') || '/',
                    security: url.searchParams.get('security') || 'tls',
                    sni: url.searchParams.get('sni') || url.searchParams.get('host') || url.hostname,
                    remarks: decodeURIComponent(url.hash.substring(1)) || 'VLESS Config',
                    raw: link
                };
            } catch(e) { 
                console.error('VLESS parse error:', e);
                return null; 
            }
        }

        function parseTrojan(link) {
            try {
                const url = new URL(link);
                return {
                    protocol: 'trojan',
                    address: url.hostname,
                    port: parseInt(url.port) || 443,
                    password: url.username,
                    network: url.searchParams.get('type') || 'ws',
                    host: url.searchParams.get('host') || url.hostname,
                    path: url.searchParams.get('path') || '/',
                    security: 'tls',
                    sni: url.searchParams.get('sni') || url.searchParams.get('host') || url.hostname,
                    remarks: decodeURIComponent(url.hash.substring(1)) || 'Trojan Config',
                    raw: link
                };
            } catch(e) { 
                console.error('Trojan parse error:', e);
                return null; 
            }
        }

        function parseShadowsocks(link) {
            try {
                let decoded = atob(link.replace('ss://', '').split('#')[0]);
                const parts = decoded.split('@');
                const serverParts = parts[1].split(':');
                const methodPassword = parts[0].split(':');
                
                return {
                    protocol: 'ss',
                    address: serverParts[0],
                    port: parseInt(serverParts[1]) || 443,
                    method: methodPassword[0],
                    password: methodPassword[1],
                    remarks: decodeURIComponent(link.split('#')[1] || '') || 'SS Config',
                    raw: link
                };
            } catch(e) { 
                console.error('SS parse error:', e);
                return null; 
            }
        }

        function parseConfig(link) {
            if (link.startsWith('vmess://')) return parseVmess(link);
            if (link.startsWith('vless://')) return parseVless(link);
            if (link.startsWith('trojan://')) return parseTrojan(link);
            if (link.startsWith('ss://')) return parseShadowsocks(link);
            return null;
        }

        // === موتور اصلی ===
        async function runEmperorSystem() {
            const btn = document.getElementById('startBtn');
            const grid = document.getElementById('gridSystem');
            const statsBar = document.getElementById('statsBar');
            
            // UI Update
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال استخراج داده‌ها...';
            grid.style.opacity = '1';
            grid.style.pointerEvents = 'all';
            statsBar.style.display = 'flex';
            
            // Clear Lists
            ['mci', 'mtn', 'rtl', 'sht'].forEach(op => {
                document.getElementById(`list-${op}`).innerHTML = '';
                document.getElementById(`badge-${op}`).innerText = '0';
            });
            
            collectedConfigs = [];
            parsedConfigs = [];

            // Fetch Loop
            let successCount = 0;
            for(let i = 0; i < REPOS.length; i++) {
                log(`دریافت از منبع ${i + 1} از ${REPOS.length}...`);
                const data = await fetchWithRetry(REPOS[i]);
                if(data) {
                    const parsed = parseLinks(data);
                    collectedConfigs.push(...parsed);
                    successCount++;
                    updateStats(collectedConfigs.length, 0, successCount);
                }
            }

            // Remove Duplicates
            collectedConfigs = [...new Set(collectedConfigs)];
            log(`پردازش ${collectedConfigs.length} کانفیگ یکتا...`);

            // Parse Configs
            for(const conf of collectedConfigs) {
                const parsed = parseConfig(conf);
                if(parsed) parsedConfigs.push(parsed);
            }

            updateStats(collectedConfigs.length, parsedConfigs.length, successCount);
            
            setTimeout(() => {
                distributeAndInject();
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-rotate"></i> اسکن مجدد شبکه';
                showToast(`${parsedConfigs.length} کانفیگ معتبر آماده تزریق`, 'success');
                log('✅ عملیات با موفقیت انجام شد. آماده تزریق.');
            }, 800);
        }

        function updateStats(total, valid, sources) {
            document.getElementById('totalConfigs').innerText = total;
            document.getElementById('validConfigs').innerText = valid;
            document.getElementById('sourceCount').innerText = sources;
        }

        // تابع دریافت هوشمند با چرخش پروکسی
        async function fetchWithRetry(url) {
            for(const proxy of PROXIES) {
                try {
                    log(`تلاش با پروکسی: ${proxy.substring(0, 30)}...`);
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), 8000); // 8 sec timeout
                    
                    const res = await fetch(proxy + encodeURIComponent(url), { signal: controller.signal });
                    clearTimeout(id);
                    
                    if(res.ok) {
                        log('✓ دریافت موفق');
                        return await res.text();
                    }
                } catch(e) { 
                    console.error('Fetch error:', e);
                    continue; 
                }
            }
            log('✗ دریافت ناموفق');
            return null;
        }

        function parseLinks(text) {
            let decoded = text;
            try { 
                if(!text.includes('://')) {
                    decoded = atob(text.replace(/\s/g,''));
                }
            } catch(e){}
            return decoded.match(/(vmess|vless|trojan|ss|hysteria2):\/\/[a-zA-Z0-9-._~:/?#[\]@!$&'()*+,;=%]+/g) || [];
        }

        // === توزیع و نمایش ===
        function distributeAndInject() {
            // محدود کردن به 10 کانفیگ برتر
            const topConfigs = parsedConfigs.slice(0, 10);
            
            topConfigs.forEach((conf, idx) => {
                renderCard(conf, 'mci', idx);
                renderCard(conf, 'mtn', idx);
                renderCard(conf, 'rtl', idx);
                renderCard(conf, 'sht', idx);
            });

            ['mci', 'mtn', 'rtl', 'sht'].forEach(k => {
                document.getElementById(`badge-${k}`).innerText = topConfigs.length;
            });
        }

        function renderCard(conf, op, idx) {
            const list = document.getElementById(`list-${op}`);
            const bug = BUGS[op];
            
            const div = document.createElement('div');
            div.className = 'config-item';
            
            const protocolClass = `protocol-${conf.protocol}`;
            const confJson = JSON.stringify(conf).replace(/'/g, "\\'");
            
            div.innerHTML = `
                <div class="config-meta">
                    <div>
                        <span class="protocol-badge ${protocolClass}">${conf.protocol}</span>
                        <span style="margin-right: 8px; font-size: 0.7rem;">${conf.remarks.substring(0, 20)}...</span>
                    </div>
                    <span class="badge" style="background:#333; color:#aaa">${bug}</span>
                </div>
                <div style="font-size: 0.65rem; color: #555; margin-bottom: 8px;">
                    ${conf.address}:${conf.port}
                </div>
                <div class="action-row">
                    <button class="btn-mini btn-copy" onclick='copyText(\`${conf.raw}\`)'>
                        <i class="fa-regular fa-copy"></i>
                    </button>
                    <button class="btn-mini btn-npv" onclick='createNPV(${confJson}, "${op}")'>
                        <i class="fa-solid fa-file-export"></i> NPV
                    </button>
                    <button class="btn-mini btn-ha" onclick='createHA(${confJson}, "${op}")'>
                        <i class="fa-solid fa-bolt"></i> HA
                    </button>
                </div>
            `;
            list.appendChild(div);
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt).then(() => showToast('کپی شد ✓', 'success'));
        }

        // === تولید فایل NPV با پارس کامل ===
        function createNPV(conf, op) {
            const host = BUGS[op];
            const name = op.toUpperCase();
            
            let outbound;
            
            if (conf.protocol === 'vmess') {
                outbound = {
                    "tag": "proxy",
                    "protocol": "vmess",
                    "settings": {
                        "vnext": [{
                            "address": conf.address,
                            "port": conf.port,
                            "users": [{
                                "id": conf.id,
                                "alterId": 0,
                                "security": "auto"
                            }]
                        }]
                    },
                    "streamSettings": {
                        "network": conf.network,
                        "security": conf.tls,
                        "tlsSettings": { 
                            "serverName": host,
                            "allowInsecure": true
                        },
                        "wsSettings": { 
                            "path": conf.path,
                            "headers": { "Host": host }
                        }
                    }
                };
            } else if (conf.protocol === 'vless') {
                outbound = {
                    "tag": "proxy",
                    "protocol": "vless",
                    "settings": {
                        "vnext": [{
                            "address": conf.address,
                            "port": conf.port,
                            "users": [{
                                "id": conf.id,
                                "encryption": "none"
                            }]
                        }]
                    },
                    "streamSettings": {
                        "network": conf.network,
                        "security": conf.security,
                        "tlsSettings": { 
                            "serverName": host,
                            "allowInsecure": true
                        },
                        "wsSettings": { 
                            "path": conf.path,
                            "headers": { "Host": host }
                        }
                    }
                };
            } else if (conf.protocol === 'trojan') {
                outbound = {
                    "tag": "proxy",
                    "protocol": "trojan",
                    "settings": {
                        "servers": [{
                            "address": conf.address,
                            "port": conf.port,
                            "password": conf.password
                        }]
                    },
                    "streamSettings": {
                        "network": conf.network,
                        "security": "tls",
                        "tlsSettings": { 
                            "serverName": host,
                            "allowInsecure": true
                        },
                        "wsSettings": { 
                            "path": conf.path,
                            "headers": { "Host": host }
                        }
                    }
                };
            } else {
                showToast('پروتکل پشتیبانی نمی‌شود', 'error');
                return;
            }

            const jsonConfig = {
                "remarks": `🔰 ${name} FREE [Emperor V5]`,
                "log": { "loglevel": "warning" },
                "inbounds": [{
                    "port": 10808,
                    "protocol": "socks",
                    "settings": { "udp": true }
                }],
                "outbounds": [outbound, { "tag": "direct", "protocol": "freedom" }],
                "routing": {
                    "rules": [{
                        "type": "field",
                        "outboundTag": "direct",
                        "domain": ["geosite:private"]
                    }]
                }
            };

            downloadFile(`Emperor_${name}_${conf.protocol}_${Date.now()}.json`, JSON.stringify(jsonConfig, null, 2));
            showToast('فایل NPV دانلود شد ✓', 'success');
        }

        // === تولید پیلود HA Tunnel ===
        function createHA(conf, op) {
            const host = BUGS[op];
            
            const payload = `GET ${conf.path || '/'} HTTP/1.1[crlf]Host: ${host}[crlf]X-Online-Host: ${host}[crlf]Connection: Keep-Alive[crlf]Upgrade: websocket[crlf][crlf]`;
            
            const finalTxt = `
================================
🔥 EMPEROR HA TUNNEL - ${op.toUpperCase()}
================================
BUG: ${host}
MODE: Custom Payload (SSL/WS)
SERVER: ${conf.address}:${conf.port}

👇 1. PASTE THIS IN PAYLOAD:
${payload}

👇 2. IMPORT THIS CONFIG:
${conf.raw}

👇 3. SETTINGS:
- Enable SSL: YES
- SNI: ${host}
- Port: ${conf.port}
================================
            `;
            
            navigator.clipboard.writeText(finalTxt).then(() => showToast('پیلود و تنظیمات کپی شد ✓', 'success'));
        }

        function downloadFile(name, content) {
            const a = document.createElement('a');
            a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(content);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

    </script>
</body>
</html>
