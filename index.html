<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emperor Titanium v41</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --bg: #030303; --cyan: #00f2ff; --mci: #00a0a5; --ira: #ffcc00; --sha: #ed1c24; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 550px; background: #0a0a0c; border: 1px solid #1a1a1a; border-radius: 35px; padding: 30px; box-shadow: 0 20px 80px rgba(0,0,0,0.7); }
        .header { margin-bottom: 25px; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; }
        .terminal { background: #000; color: #00ff9d; font-family: 'Courier New', monospace; font-size: 11px; padding: 15px; border-radius: 20px; height: 160px; overflow-y: auto; text-align: left; border: 1px solid #111; margin-bottom: 25px; border-right: 4px solid var(--cyan); }
        .btn-main { background: #fff; color: #000; width: 100%; padding: 22px; border-radius: 22px; font-weight: 900; font-size: 19px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: var(--cyan); box-shadow: 0 0 40px rgba(0,242,255,0.3); transform: translateY(-2px); }
        .isp-grid { display: grid; grid-template-columns: 1fr; gap: 15px; display: none; }
        .isp-card { background: #111; border-radius: 25px; padding: 20px; border: 1px solid #222; text-align: right; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-dl { padding: 14px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; font-family: 'Vazirmatn'; font-size: 13px; transition: 0.2s; }
        .badge { font-size: 10px; background: #222; padding: 3px 8px; border-radius: 6px; color: var(--cyan); margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 26px;">EMPEROR <span style="color:var(--cyan)">v41</span></h1>
        <p style="font-size:11px; color:#555;">سیستم یکپارچه تزریق درگاه و دور زدن نت ملی</p>
    </div>

    <div class="terminal" id="term">> سیستم آماده بارگذاری پروتکل‌های نفوذ...</div>

    <button class="btn-main" id="startBtn" onclick="runTitaniumEngine()">
        ⚡ استخراج و فعال‌سازی درگاه‌ها
    </button>

    <div class="isp-grid" id="grid">
        <div class="isp-card" style="border-right: 5px solid var(--mci);">
            <span class="badge">STEALTH ACTIVE</span>
            <b style="color:var(--mci); display:block;">همراه اول (درگاه شاپرک)</b>
            <div class="btn-group">
                <button class="btn-dl" style="background:var(--mci); color:#fff" onclick="build('mci', 'sep.shaparak.ir', 'npv')">NPV</button>
                <button class="btn-dl" style="background:#222; color:#fff" onclick="build('mci', 'sep.shaparak.ir', 'hat')">HAT</button>
            </div>
        </div>
        <div class="isp-card" style="border-right: 5px solid var(--ira);">
            <span class="badge">STEALTH ACTIVE</span>
            <b style="color:var(--ira); display:block;">ایرانسل (درگاه اسنپ)</b>
            <div class="btn-group">
                <button class="btn-dl" style="background:var(--ira); color:#000" onclick="build('ira', 'snapp.ir', 'npv')">NPV</button>
                <button class="btn-dl" style="background:#222; color:#fff" onclick="build('ira', 'snapp.ir', 'hat')">HAT</button>
            </div>
        </div>
        <div class="isp-card" style="border-right: 5px solid var(--sha);">
            <span class="badge">STEALTH ACTIVE</span>
            <b style="color:var(--sha); display:block;">شاتل (درگاه اختصاصی)</b>
            <div class="btn-group">
                <button class="btn-dl" style="background:var(--sha); color:#fff" onclick="build('sha', 'app.shatelmobile.ir', 'npv')">NPV</button>
                <button class="btn-dl" style="background:#222; color:#fff" onclick="build('sha', 'app.shatelmobile.ir', 'hat')">HAT</button>
            </div>
        </div>
    </div>
</div>

<script>
    let vault = [];
    const log = (t) => { const e = document.getElementById('term'); e.innerHTML += `<br>> ${t}`; e.scrollTop = e.scrollHeight; };

    async function runTitaniumEngine() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.innerText = "درحال اسکن مخازن گیت‌هاب...";

        const bridges = [
            "https://api.allorigins.win/raw?url=",
            "https://api.codetabs.com/v1/proxy?quest=",
            "https://corsproxy.io/?"
        ];

        const sources = [
            "https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/protocols/vless",
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt",
            "https://raw.githubusercontent.com/IranianBetterNetwork/V2Ray-Configs/main/Splitted-Configs/vless.txt"
        ];

        for (let b of bridges) {
            log(`استفاده از پل: ${b.split('/')[2]}...`);
            for (let s of sources) {
                try {
                    const res = await fetch(b + encodeURIComponent(s));
                    if (res.ok) {
                        const text = await res.text();
                        const matches = text.match(/vless:\/\/[^\s|\x22]+/gi) || [];
                        if (matches.length > 0) {
                            vault = [...vault, ...matches];
                            log(`موفقیت: ${matches.length} سرور استخراج شد.`);
                        }
                    }
                } catch (e) {}
            }
            if (vault.length > 50) break;
        }

        if (vault.length > 0) {
            document.getElementById('grid').style.display = 'grid';
            btn.innerText = "سیستم تیتانیوم فعال شد ✅";
            btn.style.background = "#32d74b";
        } else {
            log("خطا: دسترسی به منابع قطع است. از فیلترشکن استفاده کنید.");
            btn.disabled = false;
        }
    }

    function build(isp, host, ext) {
        if (vault.length === 0) return;
        const node = vault[Math.floor(Math.random() * vault.length)];
        
        // الگوریتم تزریق هدرهای Anti-DPI نسخه v41
        const payload = `GET / HTTP/1.1\r\nHost: ${host}\r\nConnection: Upgrade\r\nUpgrade: websocket\r\nUser-Agent: Mozilla/5.0 (TitaniumV41)\r\nX-Online-Host: ${host}\r\n\r\n`;

        const final = {
            v: "2", ps: `Titanium_${isp.toUpperCase()}`, add: node, 
            host: host, sni: host, payload: btoa(payload), 
            net: "ws", tls: "tls", mux: true, dns: "1.1.1.1"
        };

        const blob = new Blob([JSON.stringify(final, null, 2)], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Titanium_${isp}_V41.${ext}`;
        a.click();
        log(`فایل ${ext.toUpperCase()} برای ${isp} با موفقیت تزریق شد.`);
    }
</script>
</body>
</html>
