<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Diamond Auto-V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010409; color: #f0f6fc; font-family: system-ui; }
        .auto-glow { border: 1px solid #238636; box-shadow: 0 0 30px rgba(35, 134, 54, 0.2); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full p-10 rounded-3xl bg-[#0d1117] auto-glow text-center">
        <h1 class="text-3xl font-black text-green-500 mb-2">DIAMOND AUTO-V8</h1>
        <p class="text-[10px] text-gray-500 mb-8 uppercase tracking-widest">سیستم اسکنر خودکار سرور فعال است</p>
        
        <div id="status" class="mb-6 p-3 bg-green-500/10 rounded-xl border border-green-500/20">
            <span class="text-xs text-green-400">● سرورهای هوشمند آماده اتصال</span>
        </div>

        <button onclick="generateAuto()" class="w-full py-5 bg-green-600 hover:bg-green-500 text-white font-black rounded-2xl transition-all shadow-xl">
            🚀 دریافت کانفیگ اتوماتیک و هوشمند
        </button>

        <div id="result" class="hidden mt-6 p-4 bg-black rounded-lg border border-gray-800 break-all text-[10px] text-green-400 font-mono"></div>
        
        <a href="./app-release.apk" class="mt-8 block text-xs text-gray-500 underline">دریافت اپلیکیشن نسخه جدید (APK)</a>
    </div>

    <script>
        function generateAuto() {
            // تولید لایسنس هوشمند که به اپلیکیشن می‌گوید از لیست خودکار استفاده کن
            const payload = { mode: "auto-scan", dns: "8.8.8.8", frag: "1-3", ts: Date.now() };
            const encrypted = btoa(JSON.stringify(payload)).split('').reverse().join('');
            document.getElementById('result').innerText = "SH-AUTO-" + encrypted;
            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
