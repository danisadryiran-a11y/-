<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHADOW-0xFF • Dark Code Terminal</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
    }
    #terminal {
      padding: 20px;
      height: calc(100% - 90px);
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.45;
    }
    #controls {
      padding: 10px 20px;
      background: #000;
      border-bottom: 1px solid #0f0;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    #input-line {
      display: flex;
      padding: 10px 20px;
      background: #000;
      border-top: 1px solid #0f0;
    }
    #prompt {
      color: #0f0;
      white-space: nowrap;
    }
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #0f0;
      font-size: 1.1em;
      outline: none;
      font-family: inherit;
    }
    select, button {
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px 10px;
      font-family: inherit;
      cursor: pointer;
    }
    select option {
      background: #000;
      color: #0f0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="model-select">Model (Free 2026):</label>
    <select id="model-select">
      <option value="arcee-ai/trinity-large-preview:free">Trinity Large Preview (free) – Top frontier coding & agentic</option>
      <option value="stepfun/step-3.5-flash:free">Step 3.5 Flash (free) – Fast MoE 256K context</option>
      <option value="liquid/lfm-2.5-1.2b-thinking:free">LFM 2.5-1.2B Thinking (free) – Lightweight agentic</option>
      <option value="upstage/solar-pro-3:free">Solar Pro 3 (free) – MoE efficient (ends March 2026)</option>
    </select>
    <button onclick="saveModel()">Save Model</button>
  </div>

  <div id="terminal"></div>

  <div id="input-line">
    <span id="prompt">root@shadow-0xff:\~# </span>
    <input id="user-input" type="text" autocomplete="off" autofocus/>
  </div>

  <script src="script.js"></script>
</body>
</html>
