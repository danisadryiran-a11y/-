<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Diamond Stealth Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010409; color: #f0f6fc; font-family: sans-serif; }
        .card { border: 1px solid #30363d; background: #0d1117; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full p-8 rounded-3xl card text-center">
        <h1 class="text-2xl font-bold text-blue-400 mb-6">پنل صدور لایسنس الماس</h1>
        <button onclick="gen()" class="w-full py-4 bg-blue-600 rounded-xl font-bold mb-4">ایجاد کانفیگ هوشمند</button>
        <div id="out" class="hidden mb-6 p-3 bg-black rounded text-[10px] break-all text-cyan-500 font-mono"></div>
        <hr class="border-gray-800 my-4">
        <a href="app-release.apk" class="text-sm text-green-500 hover:underline">📥 دانلود اپلیکیشن (مخصوص شیائومی و سامسونگ)</a>
    </div>
    <script>
        function gen() {
            const code = "DIAMOND-" + Math.random().toString(36).toUpperCase().substring(2,15);
            document.getElementById('out').innerText = code;
            document.getElementById('out').classList.remove('hidden');
        }
    </script>
</body>
</html>
